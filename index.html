<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (window.location.pathname.replace(/\/+$/, '') === '/pdp') {
        var heroPreload = document.createElement('link');
        heroPreload.rel = 'preload';
        heroPreload.as = 'image';
        heroPreload.href = '/pdp/hero-australian-simple-v3.webp';
        heroPreload.imageSrcset = '/pdp/hero-australian-simple-v3-640.webp 640w, /pdp/hero-australian-simple-v3.webp 1254w';
        heroPreload.imageSizes = '(max-width: 650px) calc(100vw - 40px), (max-width: 1280px) calc((100vw - 102px) / 2), 600px';
        heroPreload.fetchPriority = 'high';
        document.head.appendChild(heroPreload);
      } else if (window.location.pathname.replace(/\/+$/, '') === '/9-reasons') {
        var articlePreload = document.createElement('link');
        articlePreload.rel = 'preload';
        articlePreload.as = 'image';
        articlePreload.href = '/reasons/01.webp';
        articlePreload.imageSrcset = '/reasons/01-640.webp 640w, /reasons/01.webp 1200w';
        articlePreload.imageSizes = '(min-width: 768px) 200px, (max-width: 620px) calc(100vw - 36px), calc(100vw - 48px)';
        articlePreload.fetchPriority = 'high';
        document.head.appendChild(articlePreload);
      }
    </script>
    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window,document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1525816065964605');
      fbq('track', 'PageView');
      if (window.location.pathname.replace(/\/+$/, '') === '/oto1') {
        fbq('track', 'Purchase');
      }
      document.addEventListener('click', function(event) {
        var link = event.target instanceof Element ? event.target.closest('a[href]') : null;
        if (link && link.dataset.pixelEvent === 'AdvertorialContinue') {
          var continueInSameTab = !event.defaultPrevented && event.button === 0 &&
            !event.metaKey && !event.ctrlKey && !event.shiftKey && !event.altKey &&
            (!link.target || link.target === '_self') && !link.hasAttribute('download');
          if (continueInSameTab) event.preventDefault();
          try {
            fbq('trackCustom', 'AdvertorialContinue', {
              content_name: 'Family Safekeep 9 Reasons',
              destination: link.pathname
            });
          } finally {
            if (continueInSameTab) {
              window.setTimeout(function() { window.location.assign(link.href); }, 350);
            }
          }
        }
        if (link && link.hostname === 'buy.stripe.com') {
          fbq('track', 'InitiateCheckout');
        }
      }, true);
    </script>
    <!-- End Meta Pixel Code -->
    <meta name="description" content="One clear family hand-off. The If I’m Not Here digital binder. PDF and Notion for $27." />
